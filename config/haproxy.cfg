global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 200000
    daemon

defaults
    log     global
    option  dontlognull
    retries 3

    timeout connect 10s
    timeout client  1h
    timeout server  1h

#################################
# ClickHouse Native (9000) - TCP
#################################
frontend ch_native
    bind *:9000
    mode tcp
    option tcplog
    default_backend ch_native_backend

backend ch_native_backend
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect

    # If long queries get dropped, raise these:
    # timeout server  2h
    # timeout client  2h

    server ch1 192.168.62.11:9000 check inter 2s fall 3 rise 2
    server ch2 192.168.62.12:9000 check inter 2s fall 3 rise 2
    server ch3 192.168.62.13:9000 check inter 2s fall 3 rise 2
#################################
# ClickHouse HTTP (8123) - HTTP
#################################
frontend ch_http
    bind *:8123
    mode http
    option httplog
    default_backend ch_http_backend

backend ch_http_backend
    mode http
    balance roundrobin

    option httpchk GET /ping
    http-check expect status 200

    option http-keep-alive
    http-reuse safe

    server ch1 192.168.62.11:8123 check inter 2s fall 3 rise 2
    server ch2 192.168.62.12:8123 check inter 2s fall 3 rise 2
    server ch3 192.168.62.13:8123 check inter 2s fall 3 rise 2
